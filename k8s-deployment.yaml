apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
  labels:
    app: task-manager
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      containers:
      - name: task-manager
        image: glenioborges/task-manager:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.2"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager-service
spec:
  selector:
    app: task-manager
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager-service
  labels:
    app: task-manager
  annotations:
    service.beta.kubernetes.io/description: "Task Manager Frontend Service"
spec:
  selector:
    app: task-manager
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 3000
    nodePort: 30080
    protocol: TCP
  sessionAffinity: None
  externalTrafficPolicy: Cluster
  
  # Options below are commented out for reference
  
  # For ClusterIP (internal only)
  # type: ClusterIP
  
  # For LoadBalancer (cloud environments)
  # type: LoadBalancer
  # loadBalancerIP: 10.0.0.1
  # loadBalancerSourceRanges:
  # - 192.168.0.0/24
